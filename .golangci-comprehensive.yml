# .golangci-comprehensive.yml
#
# Tier 2: Comprehensive Lint (~10 minutes)
# Used for: Nightly CI, pre-release validation
#
# This is the most thorough profile. It includes all Tier 0 and Tier 1
# checks plus additional analysis for code quality, complexity, and style.

version: "2"

run:
  timeout: 15m
  modules-download-mode: vendor

formatters:
  enable:
    - gofmt
    - goimports

linters:
  default: none
  enable:
    # Tier 0 (always)
    - govet
    - errcheck
    - ineffassign
    - unused
    - staticcheck
    # Tier 1 (CI)
    - gosec
    - gocritic
    - revive
    - noctx
    - contextcheck
    - durationcheck
    # Tier 2 (Comprehensive)
    - exhaustive
    - prealloc
    - gocyclo
    - funlen
    - goconst
    - dupl
    - unconvert
    - nakedret
    - misspell

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false  # Allow _, _ = pattern for intentional ignores
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*go.uber.org/zap.Logger).Sync
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode

    govet:
      enable-all: true
      disable:
        - fieldalignment  # Struct optimization suggestions - not errors
      settings:
        shadow:
          strict: true

    staticcheck:
      checks:
        - "all"
        - "-SA1019"  # Deprecated: allow for now

    gosec:
      excludes:
        - G115  # integer overflow: validated conversions
        - G404  # weak random: math/rand is fine for non-security randomness

    gocritic:
      enabled-checks:
        - appendAssign
        - argOrder
        - badCond
        - builtinShadow
        - dupCase
        - dupSubExpr
        - nilValReturn
        - rangeValCopy
        - sliceClear
      disabled-checks:
        - hugeParam

    revive:
      rules:
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: increment-decrement
        - name: var-declaration

    gocyclo:
      min-complexity: 30

    funlen:
      lines: 100
      statements: 60

    exhaustive:
      check:
        - switch
        - map
      default-signifies-exhaustive: true

    goconst:
      min-len: 3
      min-occurrences: 3

    dupl:
      threshold: 150

    misspell:
      locale: US

    nakedret:
      max-func-lines: 30

  exclusions:
    warn-unused: true
    rules:
      - path: "_test\\.go"
        linters:
          - dupl
          - funlen
          - gocyclo
          - errcheck
          - goconst
          - unused
      # G404: math/rand is acceptable in tests
      - path: "_test\\.go"
        linters:
          - gosec
        text: "G404"
      # G704: SSRF false positive in tests using localhost
      - path: "_test\\.go"
        linters:
          - gosec
        text: "G704"
      # G115: Integer overflow - intentional in bounded loops
      - linters:
          - gosec
        text: "G115:"

output:
  formats:
    text:
      print-issued-lines: true
      print-linter-name: true
