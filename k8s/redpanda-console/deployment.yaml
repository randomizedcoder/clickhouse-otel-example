apiVersion: v1
kind: ConfigMap
metadata:
  name: redpanda-console-config
  namespace: otel-demo
  labels:
    app: redpanda-console
data:
  config.yaml: |
    kafka:
      brokers:
        - redpanda:9092
      schemaRegistry:
        enabled: true
        urls:
          - http://redpanda:8081
    redpanda:
      adminApi:
        enabled: true
        urls:
          - http://redpanda:9644
    connect:
      enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-console
  namespace: otel-demo
  labels:
    app: redpanda-console
    app.kubernetes.io/name: redpanda-console
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda-console
  template:
    metadata:
      labels:
        app: redpanda-console
    spec:
      containers:
        - name: redpanda-console
          image: redpanda-console:v2.8.4
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CONFIG_FILEPATH
              value: /etc/redpanda-console/config.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/redpanda-console
          livenessProbe:
            httpGet:
              path: /admin/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /admin/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: redpanda-console-config
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda-console
  namespace: otel-demo
  labels:
    app: redpanda-console
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: redpanda-console
