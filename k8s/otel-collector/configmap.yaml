apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: otel-demo
  labels:
    app: otel-collector
data:
  config.yaml: |
    receivers:
      # OTLP receiver for direct SDK logs (Method 2)
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      # Filelog receiver for JSON logs from stdout (Method 3)
      # NOTE: This is experimental and may not work in all K8s environments
      # File pattern: /var/log/containers/<pod>_<namespace>_<container>-<id>.log
      filelog:
        include:
          - /var/log/containers/loggen-*_otel-demo_*.log
        start_at: end
        include_file_path: true
        operators:
          # Parse the container JSON wrapper (from Docker)
          - type: json_parser
            id: container_parser
          # Extract the log field content as body
          - type: move
            from: attributes.log
            to: body
          # Only process stdout logs (filelog method writes to stdout)
          # This filters out FluentBit stderr logs
          - type: filter
            id: filter_stderr
            expr: 'attributes.stream != "stdout"'
          # Parse our JSON log content to get the msg field
          - type: json_parser
            id: log_parser
            parse_from: body
            on_error: send
          # Set Body to the msg field for consistent display
          - type: move
            id: set_body
            from: attributes.msg
            to: body

    processors:
      batch:
        timeout: 1s
        send_batch_size: 100

      # Transform for filelog logs (Method 3) - set timestamp and severity
      transform/filelog:
        log_statements:
          - context: log
            statements:
              # Set timestamp from observed_time_unix_nano (filelog doesn't set timestamp)
              - set(time_unix_nano, observed_time_unix_nano) where time_unix_nano == 0
              - set(severity_text, "INFO") where attributes["level"] == "info"
              - set(severity_number, 9) where attributes["level"] == "info"

      # Resource detection for K8s metadata
      resource:
        attributes:
          - key: service.name
            value: loggen
            action: upsert

    exporters:
      # ClickHouse exporter for logs
      clickhouse:
        endpoint: tcp://clickhouse:9000?dial_timeout=10s&compress=lz4
        database: default
        logs_table_name: otel_logs
        timeout: 10s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 2
          queue_size: 100

      # Debug exporter for troubleshooting
      debug:
        verbosity: basic
        sampling_initial: 5
        sampling_thereafter: 200

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      zpages:
        endpoint: 0.0.0.0:55679

    service:
      extensions: [health_check, zpages]
      pipelines:
        # Pipeline for OTLP direct logs (Method 2)
        # No transform needed - body already contains "OTLP direct" for identification
        logs/otlp:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [clickhouse]
        # Pipeline for filelog logs (Method 3)
        # Body contains "filelog receiver" for identification
        logs/filelog:
          receivers: [filelog]
          processors: [transform/filelog, resource, batch]
          exporters: [clickhouse]
      telemetry:
        logs:
          level: info
        metrics:
          address: 0.0.0.0:8888
