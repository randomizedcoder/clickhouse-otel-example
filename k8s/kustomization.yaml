apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: otel-demo

resources:
  - namespace.yaml
  - loggen/deployment.yaml
  - fluentbit/configmap.yaml
  - fluentbit/daemonset.yaml
  - otel-collector/configmap.yaml
  - otel-collector/deployment.yaml
  - otel-collector/service.yaml
  # GDP Integration: Redpanda (Kafka-compatible) + GDP collector
  - redpanda/statefulset.yaml
  - redpanda-console/deployment.yaml
  - gdp/configmap.yaml
  - gdp/deployment.yaml
  # ClickHouse (includes GDP Kafka tables)
  - clickhouse/configmap.yaml
  - clickhouse/statefulset.yaml
  # MongoDB backend (required for HyperDX - FerretDB lacks TTL index support)
  - mongodb/statefulset.yaml
  # FerretDB backend (lightweight but lacks expireAfterSeconds TTL index support)
  # - ferretdb/statefulset.yaml
  - hyperdx/deployment.yaml
  - hyperdx/init-user-job.yaml

commonLabels:
  app.kubernetes.io/part-of: otel-demo
  app.kubernetes.io/managed-by: kustomize
