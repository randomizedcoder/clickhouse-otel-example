apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  namespace: otel-demo
  labels:
    app: clickhouse
data:
  config.xml: |
    <?xml version="1.0"?>
    <clickhouse>
        <logger>
            <level>information</level>
            <console>1</console>
        </logger>

        <http_port>8123</http_port>
        <tcp_port>9000</tcp_port>
        <interserver_http_port>9009</interserver_http_port>

        <listen_host>0.0.0.0</listen_host>

        <path>/var/lib/clickhouse/</path>
        <tmp_path>/var/lib/clickhouse/tmp/</tmp_path>
        <user_files_path>/var/lib/clickhouse/user_files/</user_files_path>

        <users_config>users.xml</users_config>
        <default_database>default</default_database>

        <mlock_executable>false</mlock_executable>

        <max_connections>100</max_connections>
        <keep_alive_timeout>3</keep_alive_timeout>
        <max_concurrent_queries>100</max_concurrent_queries>

        <mark_cache_size>5368709120</mark_cache_size>

        <!-- Kafka engine configuration for GDP -->
        <kafka>
            <debug>cgrp</debug>
            <auto_offset_reset>smallest</auto_offset_reset>
        </kafka>
        <format_schema_path>/var/lib/clickhouse/format_schemas/</format_schema_path>
    </clickhouse>

  users.xml: |
    <?xml version="1.0"?>
    <clickhouse>
        <users>
            <default>
                <password></password>
                <networks>
                    <ip>::/0</ip>
                </networks>
                <profile>default</profile>
                <quota>default</quota>
                <access_management>1</access_management>
            </default>
        </users>
        <profiles>
            <default>
                <max_memory_usage>10000000000</max_memory_usage>
                <load_balancing>random</load_balancing>
            </default>
        </profiles>
        <quotas>
            <default>
                <interval>
                    <duration>3600</duration>
                    <queries>0</queries>
                    <errors>0</errors>
                    <result_rows>0</result_rows>
                    <read_rows>0</read_rows>
                    <execution_time>0</execution_time>
                </interval>
            </default>
        </quotas>
    </clickhouse>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-init
  namespace: otel-demo
  labels:
    app: clickhouse
data:
  init.sql: |
    -- HyperDX compatible OTel logs schema
    -- Based on https://github.com/hyperdxio/hyperdx/blob/main/docker/otel-collector/schema/seed/00002_otel_logs.sql
    CREATE TABLE IF NOT EXISTS default.otel_logs (
        Timestamp DateTime64(9) CODEC(Delta(8), ZSTD(1)),
        TimestampTime DateTime DEFAULT toDateTime(Timestamp),
        TraceId String CODEC(ZSTD(1)),
        SpanId String CODEC(ZSTD(1)),
        TraceFlags UInt8,
        SeverityText LowCardinality(String) CODEC(ZSTD(1)),
        SeverityNumber UInt8,
        ServiceName LowCardinality(String) CODEC(ZSTD(1)),
        Body String CODEC(ZSTD(1)),
        ResourceSchemaUrl LowCardinality(String) CODEC(ZSTD(1)),
        ResourceAttributes Map(LowCardinality(String), String) CODEC(ZSTD(1)),
        ScopeSchemaUrl LowCardinality(String) CODEC(ZSTD(1)),
        ScopeName String CODEC(ZSTD(1)),
        ScopeVersion LowCardinality(String) CODEC(ZSTD(1)),
        ScopeAttributes Map(LowCardinality(String), String) CODEC(ZSTD(1)),
        LogAttributes Map(LowCardinality(String), String) CODEC(ZSTD(1)),
        -- HyperDX materialized columns for K8s metadata (with __hdx_materialized_ prefix)
        `__hdx_materialized_k8s.container.name` LowCardinality(String) MATERIALIZED ResourceAttributes['k8s.container.name'] CODEC(ZSTD(1)),
        `__hdx_materialized_k8s.namespace.name` LowCardinality(String) MATERIALIZED ResourceAttributes['k8s.namespace.name'] CODEC(ZSTD(1)),
        `__hdx_materialized_k8s.node.name` LowCardinality(String) MATERIALIZED ResourceAttributes['k8s.node.name'] CODEC(ZSTD(1)),
        `__hdx_materialized_k8s.pod.name` LowCardinality(String) MATERIALIZED ResourceAttributes['k8s.pod.name'] CODEC(ZSTD(1)),
        -- Custom demo columns
        RandomNumber Int32 CODEC(ZSTD(1)),
        RandomString LowCardinality(String) CODEC(ZSTD(1)),
        Count UInt64 CODEC(Delta(8), ZSTD(1)),
        -- Method column (deprecated - use Body content for pipeline identification)
        -- Kept with DEFAULT for backward compatibility with existing data
        -- Query by: Body LIKE '%FluentBit%', Body LIKE '%OTLP direct%', Body LIKE '%filelog receiver%'
        Method LowCardinality(String) DEFAULT 'unknown' CODEC(ZSTD(1)),
        -- Ingestion timestamp for latency measurement
        IngestionTimestamp DateTime64(9) DEFAULT now64(9),
        -- Indexes
        INDEX idx_trace_id TraceId TYPE bloom_filter(0.001) GRANULARITY 1,
        INDEX idx_res_attr_key mapKeys(ResourceAttributes) TYPE bloom_filter(0.01) GRANULARITY 1,
        INDEX idx_res_attr_value mapValues(ResourceAttributes) TYPE bloom_filter(0.01) GRANULARITY 1,
        INDEX idx_log_attr_key mapKeys(LogAttributes) TYPE bloom_filter(0.01) GRANULARITY 1,
        INDEX idx_log_attr_value mapValues(LogAttributes) TYPE bloom_filter(0.01) GRANULARITY 1,
        INDEX idx_lower_body lower(Body) TYPE tokenbf_v1(32768, 3, 0) GRANULARITY 8
    )
    ENGINE = MergeTree
    PARTITION BY toDate(TimestampTime)
    PRIMARY KEY (ServiceName, TimestampTime)
    ORDER BY (ServiceName, TimestampTime, Timestamp)
    TTL TimestampTime + INTERVAL 7 DAY
    SETTINGS index_granularity = 8192, ttl_only_drop_parts = 1;

  init-gdp.sql: |
    -- GDP Database and Tables
    -- Source: github.com/randomizedcoder/gdp
    -- Creates tables for storing Prometheus metrics via Kafka using Protobuf format

    CREATE DATABASE IF NOT EXISTS gdp;

    -- ProtobufSingle table for storing Prometheus metrics
    -- Schema matches prometheus_protolist.proto PromRecordCounter message
    CREATE TABLE IF NOT EXISTS gdp.ProtobufSingle (
        Timestamp_Ns DateTime64(9,'UTC') CODEC(DoubleDelta, LZ4),
        Hostname LowCardinality(String) CODEC(LZ4),
        Pop LowCardinality(String) CODEC(LZ4),
        Label LowCardinality(String) CODEC(LZ4),
        Tag LowCardinality(String) CODEC(LZ4),
        Poll_Counter UInt64 CODEC(DoubleDelta, LZ4),
        Record_Counter UInt64 CODEC(DoubleDelta, LZ4),
        Function LowCardinality(String) CODEC(LZ4),
        Variable LowCardinality(String) CODEC(LZ4),
        Type LowCardinality(String) CODEC(LZ4),
        Value Float64
    )
    ENGINE = MergeTree()
    PARTITION BY toYYYYMM(Timestamp_Ns)
    ORDER BY (Timestamp_Ns, Hostname, Pop, Label, Tag, Poll_Counter, Record_Counter)
    TTL toDateTime(Timestamp_Ns) + INTERVAL 14 DAY;

    -- Kafka engine table using ProtobufSingle format
    -- Reads from Redpanda using prometheus_protolist.proto schema
    CREATE TABLE IF NOT EXISTS gdp.ProtobufSingle_kafka (
        Timestamp_Ns DateTime64(9,'UTC') CODEC(DoubleDelta, LZ4),
        Hostname LowCardinality(String) CODEC(LZ4),
        Pop LowCardinality(String) CODEC(LZ4),
        Label LowCardinality(String) CODEC(LZ4),
        Tag LowCardinality(String) CODEC(LZ4),
        Poll_Counter UInt64 CODEC(DoubleDelta, LZ4),
        Record_Counter UInt64 CODEC(DoubleDelta, LZ4),
        Function LowCardinality(String) CODEC(LZ4),
        Variable LowCardinality(String) CODEC(LZ4),
        Type LowCardinality(String) CODEC(LZ4),
        Value Float64
    )
    ENGINE = Kafka
    SETTINGS
        kafka_broker_list = 'redpanda:9092',
        kafka_topic_list = 'ProtobufSingle',
        kafka_group_name = 'clickhouse_gdp_consumer',
        kafka_schema = 'prometheus_protolist.proto:PromRecordCounter',
        kafka_handle_error_mode = 'stream',
        kafka_poll_max_batch_size = 1024,
        kafka_format = 'ProtobufSingle';

    -- Materialized view to move data from Kafka to MergeTree
    CREATE MATERIALIZED VIEW IF NOT EXISTS gdp.ProtobufSingle_mv
    TO gdp.ProtobufSingle
    AS SELECT * FROM gdp.ProtobufSingle_kafka;

  prometheus_protolist.proto: |
    // Prometheus protolist for GDP Kafka format
    // Source: github.com/randomizedcoder/gdp
    // Field numbers must match exactly what GDP encodes
    syntax = "proto3";

    package prometheus.v1;

    option go_package = "./pkg/prometheus";

    // PromRecordCounter matches the GDP encoder's Protobuf format
    // Field numbers are 10, 20, 30... as defined in GDP source
    message PromRecordCounter {
        double timestamp_ns = 10;
        string hostname = 20;
        string pop = 30;
        string label = 50;
        string tag = 60;
        uint64 poll_counter = 70;
        uint64 record_counter = 80;
        string function = 90;
        string variable = 100;
        string type = 110;
        double value = 120;
    }
