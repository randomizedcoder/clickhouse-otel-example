apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: otel-demo
  labels:
    app: clickhouse
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: database
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      initContainers:
        - name: wait-for-redpanda
          image: clickhouse:latest
          imagePullPolicy: Never
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for Redpanda to be ready (timeout 120s)..."
              for i in {1..24}; do
                if timeout 2 bash -c "echo > /dev/tcp/redpanda/9092" 2>/dev/null; then
                  echo "Redpanda is ready"
                  exit 0
                fi
                echo "Redpanda not ready, waiting... ($i/24)"
                sleep 5
              done
              echo "Warning: Redpanda not available, proceeding anyway"
              exit 0
      containers:
        - name: clickhouse
          image: clickhouse:latest
          imagePullPolicy: Never
          command:
            - /bin/sh
            - -c
            - |
              # Start ClickHouse server in background
              clickhouse-server --config-file=/etc/clickhouse-server/config.xml &
              CH_PID=$!

              # Wait for ClickHouse to be ready (max 60 seconds)
              echo "Waiting for ClickHouse to be ready..."
              for i in $(seq 1 60); do
                if clickhouse-client --query "SELECT 1" >/dev/null 2>&1; then
                  echo "ClickHouse is ready"
                  break
                fi
                sleep 1
              done

              # Run init SQL if tables don't exist
              if [ -f /docker-entrypoint-initdb.d/init.sql ]; then
                echo "Running init SQL..."
                clickhouse-client --multiquery < /docker-entrypoint-initdb.d/init.sql || echo "Init SQL completed (may have already existed)"
              fi

              # Run GDP init SQL (creates gdp database and Kafka tables)
              if [ -f /docker-entrypoint-initdb.d/init-gdp.sql ]; then
                echo "Running GDP init SQL..."
                clickhouse-client --multiquery < /docker-entrypoint-initdb.d/init-gdp.sql || echo "GDP init SQL completed (may have already existed)"
              fi

              # Wait for ClickHouse process
              wait $CH_PID
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
            - name: native
              containerPort: 9000
              protocol: TCP
            - name: interserver
              containerPort: 9009
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: config
              mountPath: /etc/clickhouse-server/config.xml
              subPath: config.xml
            - name: config
              mountPath: /etc/clickhouse-server/users.xml
              subPath: users.xml
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: format-schemas
              mountPath: /var/lib/clickhouse/format_schemas
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
      volumes:
        - name: config
          configMap:
            name: clickhouse-config
        - name: init
          configMap:
            name: clickhouse-init
        - name: format-schemas
          configMap:
            name: clickhouse-init
            items:
              - key: prometheus_protolist.proto
                path: prometheus_protolist.proto
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: otel-demo
  labels:
    app: clickhouse
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8123
      targetPort: 8123
      protocol: TCP
    - name: native
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: interserver
      port: 9009
      targetPort: 9009
      protocol: TCP
  selector:
    app: clickhouse
