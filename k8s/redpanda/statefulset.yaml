apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: otel-demo
  labels:
    app: redpanda
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/component: messaging
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
        - name: redpanda
          image: redpanda:v24.3.8
          imagePullPolicy: Never
          command:
            - rpk
            - redpanda
            - start
            - --mode=dev-container
            - --smp=1
            - --memory=512M
            - --reserve-memory=0M
            - --overprovisioned
            - --kafka-addr=0.0.0.0:9092
            - --advertise-kafka-addr=redpanda:9092
            - --schema-registry-addr=0.0.0.0:8081
            - --advertise-rpc-addr=redpanda:33145
          ports:
            - name: kafka
              containerPort: 9092
              protocol: TCP
            - name: schema-registry
              containerPort: 8081
              protocol: TCP
            - name: admin
              containerPort: 9644
              protocol: TCP
            - name: rpc
              containerPort: 33145
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: otel-demo
  labels:
    app: redpanda
spec:
  type: ClusterIP
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
      protocol: TCP
    - name: schema-registry
      port: 8081
      targetPort: 8081
      protocol: TCP
    - name: admin
      port: 9644
      targetPort: 9644
      protocol: TCP
    - name: rpc
      port: 33145
      targetPort: 33145
      protocol: TCP
  selector:
    app: redpanda
